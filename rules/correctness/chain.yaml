id: correctness/chain
versions: ["3.5", "4.1"]
cites:
  - page: openssl-verify
    section: OPTIONS
    option: -untrusted
inputs: [root.pem, int.pem, leaf.pem]
checks:
  - run: openssl verify -CAfile root.pem -untrusted int.pem leaf.pem
    expect: "leaf.pem: OK"
  - run: openssl verify -CAfile root.pem leaf.pem
    expect_fail: true
